<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fartknight — Join a Crew</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: #0A0B0E;
           color: #fff; display: grid; place-items: center; min-height: 100vh; margin: 0;
           text-align: center; }
    h1 { font-size: 2.2rem; margin: 0.2em; }
    p { color: #8A919E; max-width: 26rem; padding: 0 1rem; }
    .code { font-family: ui-monospace, monospace; font-size: 1.6rem; color: #C8FF2E;
            letter-spacing: 0.2em; margin: 0.5em 0; }
    .emoji { font-size: 4rem; }
    a { color: #C8FF2E; }
  </style>
</head>
<body>
  <div>
    <div class="emoji">💨</div>
    <h1>Fartknight</h1>
    <p id="invite" hidden>You've been invited to a crew! Install Fartknight from the
       App Store, then enter this code under <strong>Join with Code</strong>:</p>
    <div class="code" id="code" hidden></div>
    <p id="generic">Record your farts, get them scored, battle your friends for the throne.
       <em>Coming soon to the App Store.</em></p>
    <p style="font-size:0.85rem"><a href="/fartknight/privacy.html">Privacy</a> ·
       <a href="/fartknight/terms.html">Terms</a> · <a href="mailto:pp@neatnet.tech">Support</a></p>
  </div>
  <script>
    // GitHub Pages serves this 404 for /j/{CODE} when the app isn't installed —
    // surface the code so the invite still works by hand.
    const m = location.pathname.match(/^\/j\/([A-Za-z0-9]{6,12})$/);
    if (m) {
      document.getElementById('invite').hidden = false;
      document.getElementById('code').hidden = false;
      document.getElementById('code').textContent = m[1].toUpperCase();
      document.getElementById('generic').hidden = true;
    }
  </script>
</body>
</html>
